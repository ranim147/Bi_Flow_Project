# Intégration continue : tests, lint et compilation du front à chaque push et pull request.
name: CI

on:
  push:
    branches: [feat/mvp-agents, biflow-main]
  pull_request:

jobs:
  python:
    name: Tests et lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (ceux qui demandent PostgreSQL sont ignorés)
        run: python -m pytest -q

  frontend:
    name: Front React (types et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
